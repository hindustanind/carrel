# Local production-like stack:  docker compose up --build   →  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: carrel, POSTGRES_PASSWORD: carrel, POSTGRES_DB: carrel }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U carrel"], interval: 3s, retries: 20 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://carrel:carrel@db:5432/carrel
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret-please}
      QR_SECRET: ${QR_SECRET:-change-me-qr-secret-please}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      SEED_DEMO: "1"
volumes: { pgdata: {} }
